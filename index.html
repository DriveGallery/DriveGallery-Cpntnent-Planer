<!DOCTYPE html>
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>DriveGallery — Content Planner</title>

<!-- Favicon für den Browser-Tab -->
<link rel="icon" type="image/png" href="assets/DGLOGO.png" />
<link rel="apple-touch-icon" href="assets/DGLOGO.png" />

<!-- WICHTIG: Hier muss die CSS-Datei wieder rein! -->
<link rel="stylesheet" href="style.css" />

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

</head>
<body>

  <div class="wrap">

    <!-- ===================== HEADER ===================== -->
    <header class="header">
      <div class="brand">
        <img class="brand__logo" src="assets/logo.png" alt="DriveGallery" />
        <p class="brand__sub">Content Planner</p>
      </div>
      <div class="header__status" id="syncStatus" title="Speicherstatus">
        <span class="dot" id="syncDot"></span>
        <span id="syncLabel">Lokal gespeichert</span>
      </div>
    </header>

    <!-- ===================== STAT-KACHELN ===================== -->
    <section class="stats" id="stats" aria-label="Statistik">
      <div class="stat">
        <span class="stat__value" id="statGeplant">0</span>
        <span class="stat__label">Geplant</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="statEntwurf">0</span>
        <span class="stat__label">Material fertig</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="statGepostet">0</span>
        <span class="stat__label">Gepostet</span>
      </div>
      <div class="stat stat--next">
        <span class="stat__value stat__value--mono" id="statNext">—</span>
        <span class="stat__label">Nächster Post</span>
      </div>
    </section>

    <!-- ===================== TOOLBAR: FILTER + ADD ===================== -->
    <section class="toolbar">
      <div class="tabs" id="filterTabs" role="tablist" aria-label="Filter nach Status">
        <button class="tab is-active" data-filter="alle" role="tab" aria-selected="true">Alle</button>
        <button class="tab" data-filter="Geplant" role="tab" aria-selected="false">Geplant</button>
        <button class="tab" data-filter="Material fertig" role="tab" aria-selected="false">Material fertig</button>
        <button class="tab" data-filter="Gepostet" role="tab" aria-selected="false">Gepostet</button>
      </div>
      <button class="btn btn--accent" id="openFormBtn">+ Neuer Eintrag</button>
    </section>

    <!-- ===================== FORMULAR (versteckt bis geöffnet) ===================== -->
    <section class="form-panel" id="formPanel" hidden>
      <form id="entryForm" class="form" novalidate>
        <div class="form__grid">

          <label class="field">
            <span class="field__label">Datum</span>
            <input type="date" name="date" id="fieldDate" required />
          </label>

          <label class="field">
            <span class="field__label">Status</span>
            <select name="status" id="fieldStatus" required>
              <option value="Geplant">Geplant</option>
              <option value="Material fertig">Material fertig</option>
              <option value="Gepostet">Gepostet</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">Auto</span>
            <input type="text" name="vehicle" id="fieldVehicle" placeholder="z. B. Porsche 996 Carrera" required />
          </label>

          <label class="field">
            <span class="field__label">Insta Link Inspiration</span>
            <input type="url" name="link" id="fieldLink" placeholder="https://instagram.com/..." />
          </label>

          <label class="field field--wide">
            <span class="field__label">Sonstige Notizen (optional)</span>
            <textarea name="note" id="fieldNote" rows="2" placeholder="Kurze interne Notiz…"></textarea>
          </label>

        </div>

        <div class="form__actions">
          <button type="button" class="btn btn--ghost" id="cancelFormBtn">Abbrechen</button>
          <button type="submit" class="btn btn--accent">Eintrag speichern</button>
        </div>
      </form>
    </section>

    <!-- ===================== LISTE ===================== -->
    <main class="list" id="entryList" aria-label="Geplante Beiträge">
      <!-- wird per JavaScript befüllt -->
    </main>

    <!-- Leerer Zustand -->
    <div class="empty" id="emptyState" hidden>
      <p class="empty__title">Noch nichts geplant.</p>
      <p class="empty__sub">Leg deinen ersten Post an — Datum und Auto reichen zum Start.</p>
    </div>

  </div>

  <!-- Kleine, unauffällige Lösch-Bestätigung -->
  <div class="confirm" id="confirmDialog" hidden>
    <div class="confirm__box">
      <p class="confirm__text">Diesen Eintrag wirklich löschen?</p>
      <div class="confirm__actions">
        <button class="btn btn--ghost" id="confirmCancel">Abbrechen</button>
        <button class="btn btn--danger" id="confirmDelete">Löschen</button>
      </div>
    </div>
  </div>

  <!-- Supabase-Client (optional — wird nur aktiv, wenn in script.js Zugangsdaten hinterlegt sind) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
